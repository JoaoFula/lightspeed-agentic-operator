apiVersion: agentic.openshift.io/v1alpha1
kind: ApprovalPolicy
metadata:
  name: cluster
spec:
  maxConcurrentRuns: 5
  stages:
    - name: Analysis
      approval: Manual
    - name: Execution
      approval: Manual
    - name: Verification
      approval: Manual
    # Escalation is triggered by a verification failure and only produces a
    # report. Keep it Automatic so a failure is not stranded at an unapproved
    # escalation gate.
    - name: Escalation
      approval: Automatic
