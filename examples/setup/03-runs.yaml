# Example proposals — the actual units of work.
---
# Remediation proposal (full lifecycle)
apiVersion: agentic.openshift.io/v1alpha1
kind: AgenticRun
metadata:
  name: fix-crashloop
  namespace: openshift-lightspeed
spec:
  request: "Pod api-server-xyz is crash looping in production namespace"
  tools:
    skills:
      - # TODO: Replace with Konflux-built image when available for https://github.com/openshift/agentic-skills
        image: quay.io/harpatil/agentic-skills:latest
        paths:
          - /skills/find-token
    requiredSecrets:
      - name: github-token
        description: "GitHub API token for repository access"
        mountAs:
          type: EnvVar
          envVar:
            name: GH_TOKEN
  analysis:
    agent: smart
  execution:
    agent: default
  verification:
    agent: fast
---
# Assisted proposal (execution skipped, user applies manually, then verify)
apiVersion: agentic.openshift.io/v1alpha1
kind: AgenticRun
metadata:
  name: assisted-fix
  namespace: openshift-lightspeed
spec:
  request: "High memory usage detected in staging — recommend resource limit changes"
  tools:
    skills:
      - # TODO: Replace with Konflux-built image when available for https://github.com/openshift/agentic-skills
        image: quay.io/harpatil/agentic-skills:latest
        paths:
          - /skills/find-token
  analysis:
    agent: smart
  verification:
    agent: fast
---
