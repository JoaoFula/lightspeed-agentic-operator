---
# Fully inline — full pipeline (analyze + execute + verify)
apiVersion: agentic.openshift.io/v1alpha1
kind: AgenticRun
metadata:
  name: inline-full-remediation
  namespace: openshift-lightspeed
spec:
  request: "Fix OOM kills in the payments service"
  tools:
    skills:
      - # TODO: Replace with Konflux-built image when available for https://github.com/openshift/agentic-skills
        image: quay.io/harpatil/agentic-skills:latest
        paths:
          - /skills/find-token
    requiredSecrets:
      - name: github-token
        mountAs:
          type: EnvVar
          envVar:
            name: GH_TOKEN
  analysis:
    agent: smart
  execution:
    agent: default
  verification:
    agent: fast
