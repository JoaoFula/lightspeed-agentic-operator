apiVersion: v1
kind: ServiceAccount
metadata:
  name: lightspeed-agent
  namespace: default
automountServiceAccountToken: false
---
apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: lightspeed-agent
  namespace: default
spec:
  networkPolicyManagement: Unmanaged
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: lightspeed-mock-agent
    spec:
      serviceAccountName: lightspeed-agent
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: quay.io/openshift-lightspeed/ols-qe:lightspeed-mock-agent1
          # Always pull: :lightspeed-mock-agent1 is a MUTABLE tag rebuilt in place
          # on every mock change. With the default IfNotPresent, nodes that cached
          # the tag keep the stale image after a fresh push and the e2e exercises
          # old mock behavior. (The Tekton CI path sets this explicitly too.)
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: home
              mountPath: /home/agent
            - name: skills-workdir
              mountPath: /app/skills/.agents
      volumes:
        - name: skills
          image:
            reference: placeholder:latest
        - name: home
          emptyDir: {}
        - name: skills-workdir
          emptyDir: {}
